<style id="igroteka-home-space">
/* Standalone background prerequisites not duplicated by the canonical surface below. */
body{position:relative;isolation:isolate}
#igrotekaParticleFlow{contain:strict!important}
.igroteka-route-overlay{z-index:10001!important}
</style>

<style id="igroteka-no-interactive-drag">
/* Igroteka — интерактивные элементы нельзя перетаскивать */
a, button, img, svg, [role="button"], [draggable="true"]{
  -webkit-user-drag:none !important;
  user-drag:none !important;
}
</style>

<style id="igroteka-add-row-layout">
/* PATCH 022 — keep Add Game controls on one deterministic row at desktop widths. */
.unified-add-modal .game-entry-row{
  display:grid!important;
  grid-template-columns:minmax(0,1fr) 190px 40px 28px!important;
  grid-template-rows:38px auto!important;
  align-items:center!important;
  column-gap:8px!important;
  row-gap:5px!important;
}
.unified-add-modal .game-entry-main{display:contents!important;}
.unified-add-modal .game-entry-name{grid-column:1!important;grid-row:1!important;min-width:0!important;width:100%!important;}
.unified-add-modal .game-entry-rating-wrap{grid-column:2!important;grid-row:1!important;min-width:0!important;width:100%!important;margin:0!important;align-self:center!important;}
.unified-add-modal .game-entry-favorite{grid-column:3!important;grid-row:1!important;justify-self:center!important;align-self:center!important;}
.unified-add-modal .game-entry-remove{grid-column:4!important;grid-row:1!important;justify-self:center!important;align-self:center!important;}
.unified-add-modal .game-entry-error{grid-column:1 / -1!important;grid-row:2!important;}
@media(max-width:700px){
  .unified-add-modal .game-entry-row{grid-template-columns:minmax(0,1fr) 160px 40px 28px!important;}
}
@media(max-width:520px){
  .unified-add-modal .game-entry-row{grid-template-columns:minmax(0,1fr) 40px 28px!important;grid-template-rows:38px 38px auto!important;}
  .unified-add-modal .game-entry-name{grid-column:1 / -1!important;grid-row:1!important;}
  .unified-add-modal .game-entry-rating-wrap{grid-column:1!important;grid-row:2!important;}
  .unified-add-modal .game-entry-favorite{grid-column:2!important;grid-row:2!important;}
  .unified-add-modal .game-entry-remove{grid-column:3!important;grid-row:2!important;}
  .unified-add-modal .game-entry-error{grid-row:3!important;}
}
</style>

</head>

<style id="igroteka-space-background">
/* Canonical Igroteka background: one root surface, no local page washes. */
html{
  width:100%;height:auto;min-height:100%;
  overflow-x:hidden !important;
  overflow-y:auto !important;
  background:#020203 !important;
  background-color:#020203 !important;
  isolation:isolate;
}
body{
  width:100%;height:auto;min-height:100vh;min-width:0;
  overflow-x:hidden !important;
  overflow-y:auto !important;
  background:transparent !important;
  background-color:transparent !important;
}
html::before,html::after,body::before,body::after{
  content:none !important;
  display:none !important;
  background:none !important;
  box-shadow:none !important;
}
#igrotekaParticleFlow{
  position:fixed !important;inset:0 !important;
  width:100% !important;height:100% !important;
  z-index:1 !important;display:block;
  pointer-events:none !important;
  background:transparent !important;
  mix-blend-mode:normal !important;
  transform:none !important;
  backface-visibility:visible !important;
  isolation:auto !important;
  will-change:auto !important;
}
main.wrap{position:relative;z-index:2;}
</style>

<script>
/* v1.0 Theme Preview 1 background — Cinema Mono full-spectrum living particles. */
/* Short local glint crosses + fast-particle streaks are retained; wrapped particles never draw a cross-screen streak. */
/* Animation caps at 90 FPS and pauses while hidden. */
(()=>{
  const canvas=document.getElementById('igrotekaParticleFlow');
  if(!canvas) return;
  const ctx=canvas.getContext('2d',{alpha:true});
  if(!ctx) return;
  let w=0,h=0,dpr=1,last=performance.now(),lastFrame=0,rafId=0;
  let particles=[],stars=[],glints=[];
  const MAX_FPS=90;
  const FRAME_INTERVAL=1000/MAX_FPS;
  const TAU=Math.PI*2;
  const rand=(a,b)=>a+Math.random()*(b-a);
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const HUE_CYCLE_SECONDS=72;
  const HUE_SPEED=360/HUE_CYCLE_SECONDS;
  const hslToRgb=(h,s,l)=>{h=((h%360)+360)%360;s/=100;l/=100;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let r=0,g=0,b=0;if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}return `${Math.round((r+m)*255)},${Math.round((g+m)*255)},${Math.round((b+m)*255)}`};
  const RGB_WHEEL=Array.from({length:360},(_,h)=>hslToRgb(h,82,70));
  const colorAt=(baseHue,t)=>RGB_WHEEL[(Math.floor(baseHue+t*HUE_SPEED)%360+360)%360];
  function resize(){
    const root=document.documentElement;
    const rect=canvas.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,1.5);
    w=Math.max(1,Math.round(rect.width||root.clientWidth||innerWidth));
    h=Math.max(1,Math.round(rect.height||root.clientHeight||innerHeight));
    const pixelW=Math.max(1,Math.ceil(w*dpr));
    const pixelH=Math.max(1,Math.ceil(h*dpr));
    if(canvas.width!==pixelW) canvas.width=pixelW;
    if(canvas.height!==pixelH) canvas.height=pixelH;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
  }
  const clusters=[
    [.06,.12,.16],[.16,.25,.12],[.28,.11,.12],[.43,.18,.10],
    [.58,.10,.13],[.73,.14,.15],[.88,.18,.15],[.96,.34,.13],
    [.08,.45,.14],[.20,.56,.12],[.34,.66,.12],[.50,.54,.10],
    [.65,.62,.14],[.80,.56,.13],[.92,.72,.15],[.14,.78,.13],
    [.28,.88,.14],[.44,.82,.11],[.60,.90,.13],[.78,.86,.14],[.92,.90,.13]
  ];
  function spawnParticle(clustered=false){
    let x,y;
    if(clustered){
      const c=clusters[(Math.random()*clusters.length)|0],a=rand(0,TAU),rr=Math.pow(Math.random(),1.75)*c[2];
      x=c[0]+Math.cos(a)*rr;y=c[1]+Math.sin(a)*rr*.72;
    }else{x=rand(-.02,1.02);y=rand(-.01,1.01);}
    if(Math.abs(x-.5)<.11&&y>.15&&y<.53&&Math.random()<.84)x+=(x<.5?-1:1)*rand(.035,.13);
    const depth=Math.random(),fast=depth>.865;
    return {x,y,vx:rand(-.000012,.000012)*(fast?2.15:.88),vy:rand(-.000011,.000011)*(fast?1.92:.82),drift:rand(.000005,.000023),phase:rand(0,TAU),phase2:rand(0,TAU),size:fast?rand(1.00,2.35):(depth>.66?rand(.62,1.52):rand(.30,.96)),alpha:fast?rand(.52,.96):(depth>.66?rand(.35,.76):rand(.20,.58)),hue:rand(0,360),shape:(()=>{const r=Math.random();return r<.06?'diamond':r<.18?'stretched':'round'})(),wobble:rand(.000007,.000026),fast,twinkle:rand(.50,2.3),seed:rand(0,1000)};
  }
  function spawnStar(){const depth=Math.random();return{x:rand(-.02,1.02),y:rand(-.02,1.02),phase:rand(0,TAU),size:depth>.90?rand(.66,1.08):(depth>.62?rand(.42,.78):rand(.22,.52)),alpha:depth>.90?rand(.30,.62):(depth>.62?rand(.18,.40):rand(.08,.25)),drift:rand(.0000010,.0000044),hue:rand(0,360),depth};}
  function spawnGlint(){return{x:rand(.03,.97),y:rand(.03,.97),phase:rand(0,TAU),period:rand(3.2,7.4),size:rand(1.0,1.9),alpha:rand(.18,.46),hue:rand(0,360)};}
  function rebuild(){const count=Math.min(1680,Math.max(1220,Math.round(w*h/1240)));const clustered=Math.round(count*.54);particles=Array.from({length:count},(_,i)=>spawnParticle(i<clustered));stars=Array.from({length:Math.min(520,Math.max(330,Math.round(w*h/6200)))},spawnStar);glints=Array.from({length:Math.min(34,Math.max(18,Math.round(w*h/42000)))},spawnGlint);}
  function draw(now){
    rafId=0;
    if(document.hidden) return;
    if(lastFrame&&now-lastFrame<FRAME_INTERVAL-.5){rafId=requestAnimationFrame(draw);return;}
    lastFrame=now;
    const dt=Math.min(40,now-last);last=now;const t=now*.001;ctx.clearRect(0,0,w,h);

<script>
(() => {
  // Prevent native HTML drag-and-drop of controls, links, icons and cards.
  // Text editing inside inputs/textareas/contenteditable stays available.
  const isDragBlocked = el => {
    if (!(el instanceof Element)) return false;
    return !!el.closest('a,button,img,svg,[role="button"],[draggable="true"]');
  };
  document.addEventListener('dragstart', event => {
    if (isDragBlocked(event.target)) {
      event.preventDefault();
      event.stopPropagation();
    }
  }, true);
})();
</script>
